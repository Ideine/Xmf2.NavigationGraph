resources:
  repositories:
    - repository: self
      checkoutOptions:
        clean: true
        fetchDepth: 5
        lfs: false

trigger:
  - master

name: Xmf2.NavigationGraph-CI-$(Date:yyyyMMdd)$(Rev:.r)

pool:
  vmImage: 'windows-latest'

steps:
  - task: UseDotNet@2
    displayName: Use .NET 10
    inputs:
      packageType: sdk
      version: 10.0.x

  - script: dotnet workload install ios android
    displayName: Install iOS and Android workloads

  - task: DotNetCoreCLI@2
    displayName: Restore
    inputs:
      command: 'restore'
      projects: 'Xmf2.NavigationGraph.sln'
      feedsToUse: 'select'
      vstsFeed: 'abac689f-cba8-49fc-aa05-4525b9107b76'

  - task: DotNetCoreCLI@2
    displayName: Build Package
    inputs:
      command: 'build'
      projects: 'Xmf2.NavigationGraph.sln'
      arguments: '--configuration Release --no-restore'

  - task: NuGetToolInstaller@1
    displayName: Use NuGet 6
    inputs:
      versionSpec: 6.x

  - task: NuGetCommand@2
    inputs:
      command: 'pack'
      packagesToPack: 'package.nuspec'
      versioningScheme: 'off'

  - task: PublishBuildArtifacts@1
    displayName: "Publish Artifact: drop"
    inputs:
      PathtoPublish: '$(build.artifactstagingdirectory)'
    condition: succeeded()